[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "slai"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# `pip install -e '.[dev]'` — mypy ships `mypy.stubtest`, the stub conformance gate.
dev = ["mypy"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "slai.slai"
